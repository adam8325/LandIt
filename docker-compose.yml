version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - OPENAI_API_KEY
      - AllowedOrigins=http://localhost:5173
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      - VITE_API_URL=http://localhost:8080/api
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped